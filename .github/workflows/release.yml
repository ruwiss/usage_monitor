name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            bundles: app,dmg
          - platform: ubuntu-22.04
            args: ""
            bundles: deb,rpm,appimage
          - platform: ubuntu-22.04-arm
            args: ""
            bundles: deb,rpm,appimage
          - platform: windows-latest
            args: ""
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # Ad-hoc identity "-" (see tauri.conf.json). Do not pass APPLE_CERTIFICATE,
      # APPLE_CERTIFICATE_PASSWORD, APPLE_ID, or APPLE_PASSWORD — empty secrets
      # make the bundler try to import a p12 and the signature comes out broken
      # ("app is damaged" in Gatekeeper). Hardened runtime is off for the same reason.
      - name: macOS ad-hoc signing env
        if: runner.os == 'macOS'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Usage Monitor v__VERSION__"
          releaseBody: |
            **[Download](https://github.com/ruwiss/usage_monitor/releases/latest)**

            | OS | Package |
            |---|---|
            | Windows | NSIS `.exe`, MSI |
            | Debian / Ubuntu / Mint | `.deb` (amd64, arm64) |
            | Fedora / RHEL / openSUSE | `.rpm` (x86_64, aarch64) |
            | Distro-agnostic | `.AppImage` |
            | Arch | `packaging/arch/PKGBUILD` (AUR-style, wraps AppImage) |
            | macOS | `.dmg` (Apple Silicon + Intel). Ad-hoc signed (no Developer ID). Right-click → Open, or `xattr -cr /Applications/Usage\\ Monitor.app` |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --bundles ${{ matrix.bundles }}
