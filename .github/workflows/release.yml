name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            bundles: app,dmg
          - platform: ubuntu-22.04
            args: ""
            bundles: deb,rpm,appimage
          - platform: ubuntu-22.04-arm
            args: ""
            bundles: deb,rpm,appimage
          - platform: windows-latest
            args: ""
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        with:
          tagName: v__VERSION__
          releaseName: "Usage Monitor v__VERSION__"
          releaseBody: |
            **[Download](https://github.com/ruwiss/usage_monitor/releases/latest)**

            | OS | Package |
            |---|---|
            | Windows | NSIS `.exe`, MSI |
            | Debian / Ubuntu / Mint | `.deb` (amd64, arm64) |
            | Fedora / RHEL / openSUSE | `.rpm` (x86_64, aarch64) |
            | Distro-agnostic | `.AppImage` |
            | Arch | `packaging/arch/PKGBUILD` (AUR-style, wraps AppImage) |
            | macOS | `.dmg` (Apple Silicon + Intel). Unsigned until Apple cert secrets exist. If Gatekeeper says the app is damaged: `xattr -cr /Applications/Usage\ Monitor.app` |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --bundles ${{ matrix.bundles }}
